plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

ext.platformLoader = 'neoforge'
apply from: '../../gradle/platform.gradle'
apply from: '../../gradle/fml-common.gradle'

repositories { mavenCentral() }
dependencies {
    implementation "net.neoforged:neoforge:${loader_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') { useJUnitPlatform() }

runs {
    configureEach {
        workingDirectory layout.projectDirectory.dir('run').dir(name)
        modSource sourceSets.main
    }
    client {}
    server { argument '--nogui' }
}
