buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}

plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'
ext.platformLoader = 'forge'
apply from: '../../gradle/platform.gradle'
apply from: '../../gradle/fml-common.gradle'

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory file("run/${name}")
            property 'forge.logging.console.level', 'info'
            mods { tennory { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${loader_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf('maven.modrinth:5sy6g3kz:rnhiaw3t')
    compileOnly fg.deobf('maven.modrinth:gedNE4y2:xe2EVE6q')
}

mixin {
    add sourceSets.main, 'tennory.refmap.json'
    config 'tennory.mixins.json'
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }
tasks.named('processResources') {
    from(commonProject.projectDir.toPath().resolve('src/main/resources/data/tennory/loot_table/rewards').toFile()) {
        include 'tennory_weapon_pool.json'
        into 'data/tennory/loot_tables/rewards'
    }
    // Better Combat 1.9 loads melee clips through its own registry.
    filesMatching('assets/tennory/player_animations/*.json') {
        it.path = "assets/tennory/attack_animations/${it.name}"
    }
}
tasks.named('jar') {
    manifest.attributes 'MixinConfigs': 'tennory.mixins.json'
    finalizedBy 'reobfJar'
}
